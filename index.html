<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fortnite External — External Aimbot, ESP Wallhack &amp; HWID Spoofer</title>
<meta name="description" content="Fortnite External: external aimbot with ESP wallhack, silent aim, bone targeting, FOV slider, HWID spoofer and bypass loader. Free & open source for Windows 10/11.">
<style>
  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  :root {
    --bg-0: #060913;
    --bg-1: #0b1024;
    --bg-2: #131a3a;
    --indigo: #6366f1;
    --violet: #8b5cf6;
    --cyan: #22d3ee;
    --pink: #ec4899;
    --text: #e8ecf8;
    --muted: #a3aac4;
    --line: rgba(255, 255, 255, 0.09);
    --glass: rgba(17, 23, 46, 0.62);
    --card: rgba(19, 26, 54, 0.72);
    --radius: 16px;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", "Inter", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background-color: var(--bg-0);
    background-image:
      radial-gradient(900px 520px at 12% -8%, rgba(99, 102, 241, 0.28), transparent 62%),
      radial-gradient(800px 500px at 92% 4%, rgba(139, 92, 246, 0.24), transparent 60%),
      radial-gradient(1000px 700px at 50% 108%, rgba(34, 211, 238, 0.14), transparent 65%),
      linear-gradient(165deg, #060913 0%, #0b1024 38%, #101736 68%, #0a0e1f 100%);
    background-attachment: fixed;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  .wrap {
    width: 100%;
    max-width: 1140px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ---------- NAV ---------- */
  .nav-shell {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 14px 0;
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    background: rgba(8, 12, 26, 0.62);
    border-bottom: 1px solid var(--line);
  }

  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 1.05rem;
    letter-spacing: 0.4px;
    white-space: nowrap;
  }

  .brand-mark {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    font-size: 0.95rem;
    background: linear-gradient(135deg, var(--indigo), var(--violet) 55%, var(--pink));
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
  }

  .brand-name {
    background: linear-gradient(90deg, #ffffff, #c7d2fe);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .brand-tag {
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 999px;
    color: #a5b4fc;
    border: 1px solid rgba(129, 140, 248, 0.4);
    background: rgba(99, 102, 241, 0.12);
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 28px;
    font-size: 0.9rem;
    color: var(--muted);
    font-weight: 500;
  }

  .nav-links a {
    position: relative;
    transition: color 0.2s ease;
  }

  .nav-links a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -6px;
    height: 2px;
    width: 0;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--indigo), var(--cyan));
    transition: width 0.25s ease;
  }

  .nav-links a:hover {
    color: #ffffff;
  }

  .nav-links a:hover::after {
    width: 100%;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    font-weight: 700;
    font-size: 0.92rem;
    padding: 12px 22px;
    border-radius: 11px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.22s ease, background 0.22s ease, border-color 0.22s ease;
    white-space: nowrap;
  }

  .btn-primary {
    color: #ffffff;
    background: linear-gradient(120deg, #4f46e5, #7c3aed 50%, #a855f7);
    box-shadow: 0 10px 26px -8px rgba(124, 58, 237, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.18);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 34px -8px rgba(124, 58, 237, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.22);
  }

  .btn-ghost {
    color: var(--text);
    background: rgba(255, 255, 255, 0.04);
    border-color: rgba(255, 255, 255, 0.16);
    backdrop-filter: blur(8px);
  }

  .btn-ghost:hover {
    transform: translateY(-2px);
    background: rgba(255, 255, 255, 0.09);
    border-color: rgba(139, 92, 246, 0.55);
  }

  .btn-lg {
    padding: 15px 30px;
    font-size: 1rem;
    border-radius: 13px;
  }

  /* ---------- HERO ---------- */
  .hero {
    position: relative;
    padding: 92px 0 76px;
    text-align: center;
  }

  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(circle at 50% 30%, #000 0%, transparent 72%);
    -webkit-mask-image: radial-gradient(circle at 50% 30%, #000 0%, transparent 72%);
    pointer-events: none;
  }

  .hero-inner {
    position: relative;
    z-index: 1;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: #c7d2fe;
    background: rgba(99, 102, 241, 0.12);
    border: 1px solid rgba(129, 140, 248, 0.35);
    backdrop-filter: blur(10px);
    box-shadow: 0 0 22px rgba(99, 102, 241, 0.22);
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.18);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.55; transform: scale(0.86); }
  }

  h1 {
    margin: 26px auto 0;
    max-width: 900px;
    font-size: clamp(2.2rem, 6vw, 4.15rem);
    line-height: 1.06;
    letter-spacing: -1.4px;
    font-weight: 800;
  }

  .grad {
    background: linear-gradient(96deg, #818cf8 0%, #a78bfa 30%, #22d3ee 62%, #f472b6 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 4px 26px rgba(139, 92, 246, 0.35));
  }

  .hero p.lead {
    margin: 22px auto 0;
    max-width: 680px;
    font-size: clamp(1rem, 2.1vw, 1.13rem);
    color: var(--muted);
  }

  .hero-actions {
    margin-top: 34px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
  }

  .stats {
    margin-top: 52px;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
  }

  .stat {
    padding: 18px 14px;
    border-radius: 14px;
    background: var(--glass);
    border: 1px solid var(--line);
    backdrop-filter: blur(14px);
    transition: border-color 0.22s ease, transform 0.22s ease;
  }

  .stat:hover {
    border-color: rgba(139, 92, 246, 0.45);
    transform: translateY(-3px);
  }

  .stat-value {
    font-size: 1.22rem;
    font-weight: 800;
    letter-spacing: -0.3px;
    background: linear-gradient(90deg, #ffffff, #b9c4ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .stat-label {
    margin-top: 3px;
    font-size: 0.72rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #8e97b8;
    font-weight: 600;
  }

  /* ---------- SECTIONS ---------- */
  section {
    padding: 68px 0;
    position: relative;
  }

  .sec-head {
    text-align: center;
    max-width: 640px;
    margin: 0 auto 46px;
  }

  .eyebrow {
    font-size: 0.74rem;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #a5b4fc;
  }

  h2 {
    margin: 12px 0 0;
    font-size: clamp(1.65rem, 4vw, 2.45rem);
    letter-spacing: -0.8px;
    line-height: 1.15;
    font-weight: 800;
  }

  .sec-head p {
    margin: 14px 0 0;
    color: var(--muted);
    font-size: 0.98rem;
  }

  /* ---------- FEATURES ---------- */
  .features {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
  }

  .card {
    position: relative;
    padding: 28px 24px 26px;
    border-radius: var(--radius);
    background: linear-gradient(180deg, rgba(24, 31, 62, 0.78), rgba(14, 19, 40, 0.82));
    border: 1px solid var(--line);
    backdrop-filter: blur(12px);
    overflow: hidden;
    transition: transform 0.24s ease, box-shadow 0.26s ease, border-color 0.26s ease;
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--indigo), var(--violet) 55%, var(--cyan));
    opacity: 0.9;
  }

  .card:hover {
    transform: translateY(-7px);
    border-color: rgba(139, 92, 246, 0.42);
    box-shadow: 0 24px 46px -18px rgba(79, 70, 229, 0.65);
  }

  .card-ico {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    font-size: 1.35rem;
    background: rgba(99, 102, 241, 0.13);
    border: 1px solid rgba(129, 140, 248, 0.28);
    margin-bottom: 16px;
  }

  .card h3 {
    margin: 0 0 8px;
    font-size: 1.06rem;
    font-weight: 700;
    letter-spacing: -0.2px;
  }

  .card p {
    margin: 0;
    font-size: 0.9rem;
    color: var(--muted);
  }

  /* ---------- STEPS ---------- */
  .steps {
    position: relative;
    max-width: 780px;
    margin: 0 auto;
    padding-left: 8px;
  }

  .steps::before {
    content: "";
    position: absolute;
    left: 31px;
    top: 26px;
    bottom: 26px;
    width: 2px;
    border-radius: 2px;
    background: linear-gradient(180deg, #6366f1, #8b5cf6 45%, #22d3ee 100%);
    opacity: 0.65;
  }

  .step {
    position: relative;
    display: flex;
    gap: 24px;
    padding: 18px 0;
  }

  .step-num {
    flex: 0 0 auto;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 1rem;
    color: #ffffff;
    background: linear-gradient(140deg, #4f46e5, #8b5cf6);
    border: 1px solid rgba(199, 210, 254, 0.35);
    box-shadow: 0 0 0 6px rgba(99, 102, 241, 0.1), 0 10px 24px -10px rgba(99, 102, 241, 0.9);
    position: relative;
    z-index: 1;
  }

  .step-body {
    padding-top: 4px;
  }

  .step-body h3 {
    margin: 0 0 6px;
    font-size: 1.05rem;
    font-weight: 700;
  }

  .step-body p {
    margin: 0;
    color: var(--muted);
    font-size: 0.92rem;
  }

  /* ---------- FAQ ---------- */
  .faq {
    max-width: 800px;
    margin: 0 auto;
    display: grid;
    gap: 12px;
  }

  details {
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(19, 26, 54, 0.6);
    backdrop-filter: blur(12px);
    overflow: hidden;
    transition: border-color 0.22s ease, background 0.22s ease;
  }

  details[open] {
    border-color: rgba(139, 92, 246, 0.45);
    background: rgba(26, 34, 66, 0.72);
  }

  summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding: 18px 22px;
    font-weight: 650;
    font-size: 0.98rem;
    transition: color 0.2s ease;
  }

  summary::-webkit-details-marker {
    display: none;
  }

  summary:hover {
    color: #c7d2fe;
  }

  .plus {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    border-radius: 8px;
    font-size: 1.15rem;
    line-height: 1;
    font-weight: 400;
    color: #a5b4fc;
    background: rgba(99, 102, 241, 0.14);
    border: 1px solid rgba(129, 140, 248, 0.28);
    transition: transform 0.28s ease, color 0.22s ease, background 0.22s ease;
  }

  details[open] .plus {
    transform: rotate(45deg);
    color: #f0abfc;
    background: rgba(236, 72, 153, 0.14);
    border-color: rgba(244, 114, 182, 0.4);
  }

  .faq-a {
    padding: 0 22px 20px;
    color: var(--muted);
    font-size: 0.92rem;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    margin-top: 0;
    padding-top: 16px;
  }

  /* ---------- CTA BANNER ---------- */
  .cta-card {
    position: relative;
    overflow: hidden;
    border-radius: 26px;
    padding: 62px 34px;
    text-align: center;
    border: 1px solid rgba(139, 92, 246, 0.34);
    background:
      radial-gradient(700px 320px at 50% 0%, rgba(124, 58, 237, 0.42), transparent 70%),
      radial-gradient(500px 260px at 12% 110%, rgba(34, 211, 238, 0.22), transparent 72%),
      linear-gradient(160deg, rgba(24, 30, 62, 0.94), rgba(12, 16, 34, 0.96));
    box-shadow: 0 34px 80px -40px rgba(99, 102, 241, 0.85);
  }

  .cta-card::after {
    content: "";
    position: absolute;
    inset: -40% -10% auto;
    height: 320px;
    background: radial-gradient(circle at 50% 50%, rgba(167, 139, 250, 0.35), transparent 68%);
    pointer-events: none;
  }

  .cta-card > * {
    position: relative;
    z-index: 1;
  }

  .cta-card h2 {
    margin: 0 auto;
    max-width: 620px;
  }

  .cta-card p {
    margin: 16px auto 0;
    max-width: 540px;
    color: var(--muted);
    font-size: 0.97rem;
  }

  .cta-card .hero-actions {
    margin-top: 30px;
  }

  .micro {
    margin-top: 18px;
    font-size: 0.74rem;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: #7c86a8;
    font-weight: 600;
  }

  /* ---------- FOOTER ---------- */
  footer {
    border-top: 1px solid var(--line);
    margin-top: 40px;
    padding: 34px 0 42px;
    background: rgba(6, 9, 19, 0.6);
    backdrop-filter: blur(10px);
  }

  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    flex-wrap: wrap;
    font-size: 0.86rem;
    color: #8e97b8;
  }

  .foot-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    color: #dfe5ff;
  }

  .foot a.git {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.04);
    color: #dfe5ff;
    font-weight: 600;
    transition: border-color 0.22s ease, background 0.22s ease, transform 0.2s ease;
  }

  .foot a.git:hover {
    border-color: rgba(139, 92, 246, 0.55);
    background: rgba(139, 92, 246, 0.12);
    transform: translateY(-1px);
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 960px) {
    .features {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .stats {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 640px) {
    .wrap {
      padding: 0 16px;
    }
    .nav-links {
      display: none;
    }
    .nav {
      gap: 12px;
    }
    .brand-tag {
      display: none;
    }
    .nav .btn {
      padding: 10px 16px;
      font-size: 0.84rem;
    }
    .hero {
      padding: 62px 0 54px;
    }
    h1 {
      letter-spacing: -0.8px;
    }
    .features {
      grid-template-columns: 1fr;
    }
    .stats {
      grid-template-columns: 1fr;
      margin-top: 38px;
    }
    .hero-actions {
      flex-direction: column;
      align-items: stretch;
    }
    .hero-actions .btn {
      width: 100%;
    }
    .steps::before {
      left: 23px;
    }
    .step {
      gap: 16px;
    }
    .step-num {
      width: 40px;
      height: 40px;
      font-size: 0.9rem;
    }
    .cta-card {
      padding: 46px 20px;
      border-radius: 20px;
    }
    .foot {
      flex-direction: column;
      text-align: center;
    }
    summary {
      padding: 16px 16px;
      font-size: 0.92rem;
    }
    .faq-a {
      padding: 14px 16px 18px;
    }
  }
</style>
</head>
<body>

  <!-- ================= NAV ================= -->
  <div class="nav-shell">
    <div class="wrap nav">
      <a href="#top" class="brand" aria-label="Fortnite External home">
        <span class="brand-mark">🎯</span>
        <span class="brand-name">Fortnite&nbsp;External</span>
        <span class="brand-tag">Open&nbsp;Source</span>
      </a>

      <nav class="nav-links" aria-label="Primary">
        <a href="#features">Features</a>
        <a href="#how">How it works</a>
        <a href="#faq">FAQ</a>
      </nav>

      <a class="btn btn-primary" href="https://gitscore.cc" rel="noopener">Download</a>
    </div>
  </div>

  <main id="top">

    <!-- ================= HERO ================= -->
    <section class="hero">
      <div class="wrap hero-inner">
        <span class="pill"><span class="dot"></span> Fortnite External Aimbot</span>

        <h1>External Aimbot for Fortnite — <span class="grad">Silent Aim, ESP &amp; Bone Targeting</span
